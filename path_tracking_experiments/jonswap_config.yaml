# References:
# [1] Y. Deng, X. Ren, M. Nuernberg, and L. Tao, "Launch and recovery of a work class ROV through wave zone in small offshore service vessel," Ocean Engineering, vol. 309, p. 118541, 2024.
# [2] M. Valen, "Launch and recovery of ROV: Investigation of operational limit from DNV Recommended Practices and time domain simulations in SIMO," Master thesis, Department of Marine Technology, NTNU, Trondheim, Norway, 2010.

default_scenario: moderate

scenarios:

  calm:
    Hs: 1.25
    Tp: 7.03
    gamma: 1.5
    N: 64
    wave_dir: [1.0, 0.0]
    scale: 0.25
    max_current: 0.14
    alpha_wave: 0.02
    noise_std: 0.005
    alpha_noise: 0.30
    seed: 42

  moderate:
    Hs: 2.50
    Tp: 8.0
    gamma: 3.3
    N: 64
    wave_dir: [0.707, 0.707]
    scale: 0.50
    max_current: 0.50
    alpha_wave: 0.02
    noise_std: 0.010
    alpha_noise: 0.30
    seed: 42

  severe:
    Hs: 4.50
    Tp: 8.0
    gamma: 3.3
    N: 64
    wave_dir: [0.0, 1.0]
    scale: 0.80
    max_current: 0.80
    alpha_wave: 0.02
    noise_std: 0.020
    alpha_noise: 0.30
    seed: 42

  extreme:
    Hs: 4.50
    Tp: 8.0
    gamma: 5.0
    N: 128
    wave_dir: [-1.0, 0.0]
    scale: 1.20
    max_current: 1.50
    alpha_wave: 0.02
    noise_std: 0.030
    alpha_noise: 0.30
    seed: 42