experiment:
  mode: stationkeeping
  dt: 0.1
  steps: 1000
  repetitions: 3
  seed: 3000000000
  thrust_limit: 40.0
  render_mode: null
output: {}
environment:
  training_run: ../../artifacts/training/stationkeeping_waves_yaw
controllers:
- name: pid
  enabled: true
  params: {}
- name: ppo
  enabled: true
  params:
    observation_adapter: stationkeeping
    model_path: ../../artifacts/training/stationkeeping_waves_yaw/models/ppo_stationkeeping_waves_yaw.zip
    vecnormalize_path: ../../artifacts/training/stationkeeping_waves_yaw/models/vec_normalize_stationkeeping_waves_yaw.pkl
    env_config_path: ../dynamics/blue_rov_config.yaml
    dynamics_config_path: ../dynamics/dynamics_config.yaml
- name: smc
  enabled: true
  params: {}
- name: nmpc
  enabled: true
  params:
    horizon: 10
    control_blocks: 5
disturbance:
  default_scenario: walker_w1
  scenarios:
    walker_w1:
      Hs: 2.78
      Tp: 7.1
      gamma: 3.3
      N: 64
      wave_dir:
      - 1.0
      - 0.0
      directional_spread_deg: 0.0
      water_depth: 54.0
      x_eval: 0.0
      y_eval: 0.0
      z_eval: -5.0
      scale: 1.0
      max_current: 1000000.0
      alpha_wave: 0.02
      noise_std: 0.0
      alpha_noise: 0.3
      alpha_js: 0.0081
      enable_wave_force: true
      wave_force_gain:
      - 35.0
      - 35.0
      - 50.0
      wave_force_application_point:
