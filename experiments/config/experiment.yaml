experiment:
  mode: trajectory_suite          # stationkeeping | trajectory_suite
  dt: 0.1
  steps: 1000
  repetitions: 5
  thrust_limit: 40.0
  render_mode: null

output:
  directory: results-moderate/trajectory_experiments

controllers:
  - name: pid
    enabled: true
    params: {}

  - name: ppo
    enabled: true
    params:
      model_path: ppo_trajectory_final
      vecnormalize_path: vec_normalize.pkl
      env_config_path: config/blue_rov_config.yaml
      dynamics_config_path: config/dynamics_config.yaml

  - name: smc
    enabled: true
    params: {}

  - name: nmpc
    enabled: true
    params:
      horizon: 10
      control_blocks: 5

disturbance:
  config_path: experiments/ocean_environment.yaml
  default_scenario: moderate

trajectories:
  - name: square
    enabled: true
    params: {}

  - name: figure_eight_depth
    enabled: true
    params: {}

  - name: circle
    enabled: true
    params: {}

  - name: letter_b
    enabled: true
    params: {}

  - name: star
    enabled: true
    params: {}

stationkeeping:
  targets:
    - { id: 1, name: center_forward, pos: [0.0, 0.0, -0.8], yaw_deg: 0.0 }
    - { id: 2, name: front, pos: [2.0, 0.0, -0.8], yaw_deg: 0.0 }
    - { id: 3, name: front_right, pos: [2.0, 2.0, -0.8], yaw_deg: 45.0 }
    - { id: 4, name: front_left, pos: [2.0, -2.0, -0.8], yaw_deg: -45.0 }
    - { id: 5, name: rear, pos: [-2.0, 0.0, -0.8], yaw_deg: 180.0 }
    - { id: 6, name: rear_right, pos: [-2.0, 2.0, -0.8], yaw_deg: 135.0 }
    - { id: 7, name: rear_left, pos: [-2.0, -2.0, -0.8], yaw_deg: -135.0 }
    - { id: 8, name: shallow, pos: [1.5, 0.0, -0.4], yaw_deg: 90.0 }
    - { id: 9, name: mid_depth, pos: [0.0, 2.5, -1.5], yaw_deg: 90.0 }
    - { id: 10, name: deep, pos: [0.0, -2.5, -3.0], yaw_deg: -90.0 }
    - { id: 11, name: side_inspection, pos: [3.0, 0.0, -1.2], yaw_deg: 90.0 }
    - { id: 12, name: structure_view, pos: [3.0, 3.0, -2.0], yaw_deg: 225.0 }
    - { id: 13, name: far_corner, pos: [4.0, -4.0, -2.0], yaw_deg: 315.0 }
    - { id: 14, name: far_corner_opposite, pos: [-4.0, 4.0, -2.0], yaw_deg: 135.0 }
    - { id: 15, name: deep_far, pos: [4.0, 4.0, -4.0], yaw_deg: 45.0 }