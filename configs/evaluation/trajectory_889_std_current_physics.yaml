# Intentional transfer evaluation: std-trained policy in CURRENT corrected physics.
# No training_run inheritance because evaluation physics deliberately differ.
experiment:
  mode: trajectory_suite
  dt: 0.1
  steps: 1000
  repetitions: 1
  seed: 42
  thrust_limit: 40.0
  render_mode: null
environment:
  config:
    dt: 0.1
  dynamics_config_file: ../dynamics/dynamics_config.yaml
controllers:
- name: ppo
  enabled: true
  params:
    observation_adapter: legacy
    model_path: ../../artifacts/training/trajectory_889_std/models/ppo_trajectory_final.zip
    vecnormalize_path: ../../artifacts/training/trajectory_889_std/models/vec_normalize.pkl
    env_config_path: ../dynamics/blue_rov_config.yaml
    dynamics_config_path: ../dynamics/dynamics_config.yaml
disturbance:
  default_scenario: training_sea
  scenarios:
    training_sea:
      Hs: 2.0
      Tp: 12.0
      gamma: 3.3
      N: 64
      wave_dir:
      - 0.5
      - 0.5
      directional_spread_deg: 25.0
      water_depth: 30.0
      x_eval: 0.0
      y_eval: 0.0
      z_eval: -2.0
      scale: 0.5
      max_current: 0.7
      alpha_wave: 0.02
      noise_std: 0.01
      alpha_noise: 0.3
      alpha_js: 0.0081
      enable_wave_force: true
      wave_force_gain:
      - 35.0
      - 35.0
      - 50.0
      wave_force_application_point:
      - 0.0
      - 0.0
      - 0.05
      max_wave_force: 25.0
      max_wave_moment: 8.0
      seed: 42
trajectories:
- name: square
  enabled: true
  params: {}
