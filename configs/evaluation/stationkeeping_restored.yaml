# Trained stationkeeping PPO versus PID/SMC at a fixed setpoint.
# All configured sea scenarios are evaluated in stationkeeping mode.
experiment:
  mode: stationkeeping
  dt: 0.1
  steps: 1000
  repetitions: 3
  thrust_limit: 40.0
  render_mode: null
output: {}
environment:
  training_run: ../../artifacts/training/stationkeeping_restored
controllers:
- name: pid
  enabled: true
  params: {}
- name: ppo
  enabled: true
  params:
    model_path: ../../artifacts/training/stationkeeping_restored/models/bluerov_ppo.zip
    vecnormalize_path: ../../artifacts/training/stationkeeping_restored/models/bluerov_vec_normalize.pkl
    env_config_path: ../dynamics/blue_rov_config.yaml
    dynamics_config_path: ../dynamics/dynamics_config.yaml
- name: smc
  enabled: true
  params: {}
disturbance:
  default_scenario: training_sea
  scenarios:
    training_sea:
      Hs: 2.0
      Tp: 12.0
      gamma: 3.3
      N: 64
      wave_dir:
      - 0.5
      - 0.5
      directional_spread_deg: 25.0
      water_depth: 30.0
      x_eval: 0.0
      y_eval: 0.0
      z_eval: -2.0
      scale: 0.5
      max_current: 0.7
      alpha_wave: 0.02
      noise_std: 0.01
      alpha_noise: 0.3
      alpha_js: 0.0081
      enable_wave_force: true
      wave_force_gain:
      - 35.0
      - 35.0
      - 50.0
      wave_force_application_point:
      - 0.0
      - 0.0
      - 0.05
      max_wave_force: 25.0
      max_wave_moment: 8.0
      seed: 42
stationkeeping:
  targets:
  - id: 1
    name: depth_hold
    pos:
    - 0.0
    - 0.0
    - -0.8
    yaw_deg: 0.0
