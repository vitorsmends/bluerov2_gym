# Walker W1-W3 Hs/Tp analogue, not an exact reproduction of buoy spectra or loading.
# Same target mechanical plant; first-order Airy waves, body rotation, no filters/noise.
# max_current=1e6 disables practical velocity capping; empirical force caps retained.
