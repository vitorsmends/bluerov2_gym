# Validated curriculum PPO: paired weights/normalizer and physical snapshot of the new training.
experiment:
  mode: trajectory_suite
  dt: 0.1
  steps: 1000
  repetitions: 3
  thrust_limit: 40.0
  render_mode: null
output:
  directory: artifacts/evaluation/imported/results-severe/trajectory_experiments
environment:
  training_run: ../../artifacts/training/curriculum_restored
controllers:
- name: pid
  enabled: true
  params: {}
- name: ppo
  enabled: true
  params:
    observation_adapter: legacy
    model_path: ../../artifacts/training/curriculum_restored/models/bluerov_ppo_curriculum.zip
    vecnormalize_path: ../../artifacts/training/curriculum_restored/models/bluerov_vec_normalize_curriculum.pkl
    env_config_path: ../dynamics/blue_rov_config.yaml
    dynamics_config_path: ../dynamics/dynamics_config.yaml
- name: smc
  enabled: true
  params: {}
disturbance:
  config_path: ocean.yaml
  default_scenario: severe
trajectories:
- name: square
  enabled: true
  params: {}
- name: figure_eight_depth
  enabled: true
  params: {}
- name: circle
  enabled: true
  params: {}
stationkeeping:
  targets:
  - id: 1
    name: center_forward
    pos:
    - 0.0
    - 0.0
    - -0.8
    yaw_deg: 0.0
  - id: 2
    name: front
    pos:
    - 2.0
    - 0.0
    - -0.8
    yaw_deg: 0.0
  - id: 3
    name: front_right
    pos:
    - 2.0
    - 2.0
    - -0.8
    yaw_deg: 45.0
  - id: 4
    name: front_left
    pos:
    - 2.0
    - -2.0
    - -0.8
    yaw_deg: -45.0
  - id: 5
    name: rear
    pos:
    - -2.0
    - 0.0
    - -0.8
    yaw_deg: 180.0
  - id: 6
    name: rear_right
    pos:
    - -2.0
    - 2.0
    - -0.8
    yaw_deg: 135.0
  - id: 7
    name: rear_left
    pos:
    - -2.0
    - -2.0
    - -0.8
    yaw_deg: -135.0
  - id: 8
    name: shallow
    pos:
    - 1.5
    - 0.0
    - -0.4
    yaw_deg: 90.0
  - id: 9
    name: mid_depth
    pos:
    - 0.0
    - 2.5
    - -1.5
    yaw_deg: 90.0
  - id: 10
    name: deep
    pos:
    - 0.0
    - -2.5
    - -3.0
    yaw_deg: -90.0
  - id: 11
    name: side_inspection
    pos:
    - 3.0
    - 0.0
    - -1.2
    yaw_deg: 90.0
  - id: 12
    name: structure_view
    pos:
    - 3.0
    - 3.0
    - -2.0
    yaw_deg: 225.0
  - id: 13
    name: far_corner
    pos:
    - 4.0
    - -4.0
    - -2.0
    yaw_deg: 315.0
  - id: 14
    name: far_corner_opposite
    pos:
    - -4.0
    - 4.0
    - -2.0
    yaw_deg: 135.0
  - id: 15
    name: deep_far
    pos:
    - 4.0
    - 4.0
    - -4.0
    yaw_deg: 45.0
