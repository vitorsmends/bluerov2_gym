# New default trajectory curriculum: Walker-inspired W1-W3, not exact buoy/load replication.
# Fresh PPO, constant-depth eight at -5m; both filters/noise disabled; unit velocity scale.
# 3M steps is a planning reference, never a hard phase budget.
