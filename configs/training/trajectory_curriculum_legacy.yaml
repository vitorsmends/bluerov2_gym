# Previous multi-trajectory curriculum, preserved for comparisons.
reference:
  commit: 889a766e4615098659a2f923782a1a56f921edd3
  path: experiments_traj/train_ppo.py
  sha256: 44758d653df6a9d843d349664cb62730d9d37887311edcee75f3ff76b5697424
  scope: PPO/feedback/reward recipe 889a766, with explicit episode trajectory rotation
    and goal-based sea curriculum; current simulator unchanged.
environment:
  id: BlueRov-v0
  max_episode_steps: 1000
  render_mode: null
  config:
    dt: 0.1
  dynamics_config_file: ../dynamics/dynamics_config.yaml
paths:
  tensorboard_log: ../../artifacts/logs/tensorboard/
  model_dir: ../../artifacts/models/trajectory_curriculum_legacy/
  model_name: ppo_trajectory_curriculum
  vecnormalize_name: vec_normalize_trajectory_curriculum.pkl
vecnormalize:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
checkpoint:
  save_freq: 50000
  name_prefix: ppo_trajectory_curriculum_checkpoint
  save_vecnormalize: true
ppo:
  policy: MultiInputPolicy
  verbose: 1
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs: {}
training:
  task: trajectory_curriculum_legacy
  device: auto
  seed: null
  tb_log_name: PPO_BlueROV2_TrajectoryCurriculum
trajectory_selection:
  episodes_per_trajectory: 3
curriculum_transition:
  mode: success
  settling_time_seconds: 10.0
  position_tolerance_m: 0.2
  min_tracking_fraction: 0.9
  max_rmse_m: 0.2
  consecutive_successes_per_trajectory: 3
jonswap_defaults:
  Hs: 2.0
  Tp: 12.0
  gamma: 3.3
  N: 64
  wave_dir:
  - 0.5
  - 0.5
  directional_spread_deg: 25.0
  water_depth: 30.0
  x_eval: 0.0
  y_eval: 0.0
  z_eval: -2.0
  scale: 0.5
  max_current: 0.7
  alpha_wave: 0.02
  noise_std: 0.01
  alpha_noise: 0.3
  alpha_js: 0.0081
  enable_wave_force: true
  wave_force_gain:
  - 35.0
  - 35.0
  - 50.0
  wave_force_application_point:
  - 0.0
  - 0.0
  - 0.05
  max_wave_force: 25.0
  max_wave_moment: 8.0
  seed: 42
curriculum:
- name: No Waves
  jonswap:
    Hs: 0.0
    Tp: 8.0
    gamma: 1.0
    N: 32
    wave_dir:
    - 1.0
    - 0.0
    scale: 0.0
    max_current: 0.0
    noise_std: 0.0
    directional_spread_deg: 0.0
    enable_wave_force: false
  trajectories:
  - name: reference_889_figure_eight
    params: {}
- name: Calm Sea - Head Waves
  jonswap:
    Hs: 1.25
    Tp: 7.03
    gamma: 1.5
    N: 64
    wave_dir:
    - 1.0
    - 0.0
    scale: 0.25
    max_current: 0.14
    noise_std: 0.005
    directional_spread_deg: 15.0
    enable_wave_force: true
    max_wave_force: 15.0
    max_wave_moment: 5.0
  trajectories:
  - name: reference_889_figure_eight
    params: {}
  - name: circle
    params: {}
- name: Moderate Sea - Quartering Waves
  jonswap:
    Hs: 2.5
    Tp: 8.0
    gamma: 3.3
    N: 64
    wave_dir:
    - 0.707
    - 0.707
    scale: 0.5
    max_current: 0.5
    noise_std: 0.01
    directional_spread_deg: 25.0
    enable_wave_force: true
    max_wave_force: 25.0
    max_wave_moment: 8.0
  trajectories:
  - name: reference_889_figure_eight
    params: {}
  - name: circle
    params: {}
  - name: square
    params: {}
- name: Severe Sea - Beam Waves
  jonswap:
    Hs: 4.5
    Tp: 8.0
    gamma: 3.3
    N: 64
    wave_dir:
    - 0.0
    - 1.0
    scale: 0.8
    max_current: 0.8
    noise_std: 0.02
    directional_spread_deg: 25.0
    enable_wave_force: true
    max_wave_force: 35.0
    max_wave_moment: 10.0
  trajectories:
  - name: reference_889_figure_eight
    params: {}
  - name: circle
    params: {}
  - name: square
    params: {}
  - name: figure_eight_depth
    params: {}
- name: Extreme Sea - Following Waves
  jonswap:
    Hs: 4.5
    Tp: 8.0
    gamma: 5.0
    N: 128
    wave_dir:
    - -1.0
    - 0.0
    scale: 1.2
    max_current: 1.5
    noise_std: 0.03
    directional_spread_deg: 35.0
    enable_wave_force: true
    wave_force_gain:
    - 45.0
    - 45.0
    - 65.0
    max_wave_force: 40.0
    max_wave_moment: 12.0
  trajectories:
  - name: reference_889_figure_eight
    params: {}
  - name: circle
    params: {}
  - name: square
    params: {}
  - name: figure_eight_depth
    params: {}
  - name: star
    params: {}
