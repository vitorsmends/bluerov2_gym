paths:
  tensorboard_log: ../../artifacts/logs/tensorboard
  model_dir: ../../artifacts/models/ppo_curriculum_unfiltered
  model_name: ppo_trajectory_curriculum
  vecnormalize_name: vec_normalize_trajectory_curriculum.pkl
vecnormalize:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
checkpoint:
  save_freq: 50000
  name_prefix: ppo_physics_curriculum_checkpoint
  save_vecnormalize: true
ppo:
  policy: MultiInputPolicy
  verbose: 1
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs: {}
training:
  task: trajectory_curriculum
  device: auto
  seed: 42
  phase_planned_timesteps: 3000000
  tb_log_name: PPO_PhysicsWaveCurriculum_Unfiltered
evaluation:
  every_timesteps: 20000
  duration_seconds: 100.0
  settling_time_seconds: 10.0
  episodes: 20
  groups: 4
  seed: 100042
curriculum_transition:
  mode: success
  position_tolerance_m: 0.2
  min_tracking_fraction: 0.9
  max_rmse_m: 0.2
  min_batch_success_rate: 0.9
  min_group_success_rate: 0.9
  consecutive_batches: 3
rehearsal:
  probability: 0.3
plateau_early_stopping:
  enabled: false
  patience_evaluations: 20
  warmup_evaluations: 5
  min_delta_m: 0.01
curriculum:
- name: A - std sem ondas
  mechanics_model: std
  disturbance_model:
    preset: std
    normalize_spectrum: false
    wave_filter: false
    noise_filter: false
  jonswap:
    Hs: 0.0
    scale: 0.0
    max_current: 0.0
    noise_std: 0.0
    enable_wave_force: false
    alpha_js: 0.0
  evaluation:
    every_timesteps: 10000
    settling_time_seconds: 10.0
    groups: 1
  transition:
    consecutive_batches: 2
- name: B - std train_stable_traj
  mechanics_model: std
  disturbance_model:
    preset: std
    normalize_spectrum: false
    wave_filter: false
    noise_filter: false
  jonswap:
