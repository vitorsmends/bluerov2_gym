# Article PPO curriculum, initialized from scratch; no fine-tuning.
# Disable both temporal filters and additive Gaussian velocity noise in all phases.
# Scale/cap, selected depth kernel, empirical loads and mechanics otherwise retained.
reference:
  commit: 889a766e4615098659a2f923782a1a56f921edd3
  path: experiments_traj/train_ppo.py
  sha256: 44758d653df6a9d843d349664cb62730d9d37887311edcee75f3ff76b5697424
  scope: PPO 889a766 with optional relative-yaw feedback and penalty; std pretraining
    then corrected mechanics and Hs-normalized waves.
  implementation: Unmodified historical source plus current simulator constructor
    logging aliases and configurable yaw feedback/reward.
